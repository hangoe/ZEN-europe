# Model variants: settings patches on top of zen_europe_config.yaml.
defaults:
  settings:
    structure:
      set_sectors:
        - electricity
        - carbon
        - gas
        - heat
        - district_heating
        - hydrogen
        - ammonia
        - cement
        - methanol
        - refining
        - aviation
        - shipping
        - steel
        - passenger_transport
        - truck_transport
        - glass
        - ceramic
        - paper
        - food

models:
  # ZEN-europe base: glass, ceramic, paper and food with full flexibility (thermal
  # energy storage and demand-side management)
  zen_europe_base: {}

  # the original ZEN-europe: no industrial heat (paper, ceramic, glass, food), no
  # TES and no DSM
  zen_europe_no_industry_heat:
    settings:
      structure:
        remove_sectors: [glass, ceramic, paper, food]
      industry_flexibility:
        use_tes: false
        dsm_shiftability: none

  zen_europe_ind_heat_no_flexibility:
    settings:
      industry_flexibility:
        use_tes: false
        dsm_shiftability: none

  zen_europe_ind_heat_no_flexibility_nodiffusion:
    extends: zen_europe_ind_heat_no_flexibility
    settings:
      investment:
        use_diffusion_rates: false

  zen_europe_ind_heat_TES_only:
    settings:
      industry_flexibility:
        dsm_shiftability: none

  zen_europe_ind_heat_DSM_only:
    settings:
      industry_flexibility:
        use_tes: false

  # DSM only, with the pessimistic DSM shiftability categories
  zen_europe_ind_heat_DSM_pessimistic:
    extends: zen_europe_ind_heat_DSM_only
    settings:
      industry_flexibility:
        dsm_shiftability: pessimistic

  # only the highest temperature band has heat pumps, the lower bands are supplied
  # via the temperature cascade
  zen_europe_ind_heat_single_temp:
    settings:
      industry_flexibility:
        heat_pump_temp_levels: ["150_200"]

  zen_europe_ind_heat_no_flexibility_single_temp:
    extends: zen_europe_ind_heat_no_flexibility
    settings:
      industry_flexibility:
        heat_pump_temp_levels: ["150_200"]
