# Model variants: settings patches on top of zen_europe_config.yaml.
defaults:
  settings:
    structure:
      set_sectors:
        - electricity
        - carbon
        - gas
        - heat
        - district_heating
        - hydrogen
        - ammonia
        - cement
        - methanol
        - refining
        - aviation
        - shipping
        - steel
        - passenger_transport
        - truck_transport
        - industry_heat
        - industry_tes
        - industry_dsm

models:
  # full flexibility: thermal energy storage and demand-side management
  zen_europe_ind_heat_v1: {}

  zen_europe_ind_heat_v1_no_flexibility:
    settings:
      structure:
        remove_sectors: [industry_tes, industry_dsm]

  zen_europe_ind_heat_v1_no_flexibility_nodiffusion:
    extends: zen_europe_ind_heat_v1_no_flexibility
    settings:
      investment:
        use_diffusion_rates: false

  zen_europe_ind_heat_v1_TES_only:
    settings:
      structure:
        remove_sectors: [industry_dsm]

  zen_europe_ind_heat_v1_DSM_only:
    settings:
      structure:
        remove_sectors: [industry_tes]

  zen_europe_ind_heat_v1_DSM_pessimistic:
    settings:
      industry:
        dsm_shiftability: pessimistic

  # only the highest temperature band has heat pumps
  zen_europe_ind_heat_v1_single_temp:
    settings:
      structure:
        remove_technologies: &low_band_heat_pumps
          - heat_pump_industry_0_100_waste_heat_glass
          - heat_pump_industry_0_100_water_glass
          - heat_pump_industry_100_150_waste_heat_glass
          - heat_pump_industry_100_150_water_glass
          - heat_pump_industry_0_100_waste_heat_ceramic
          - heat_pump_industry_0_100_water_ceramic
          - heat_pump_industry_100_150_waste_heat_ceramic
          - heat_pump_industry_100_150_water_ceramic
          - heat_pump_industry_0_100_waste_heat_paper
          - heat_pump_industry_0_100_water_paper
          - heat_pump_industry_100_150_waste_heat_paper
          - heat_pump_industry_100_150_water_paper
          - heat_pump_industry_0_100_waste_heat_food
          - heat_pump_industry_0_100_water_food
          - heat_pump_industry_100_150_waste_heat_food
          - heat_pump_industry_100_150_water_food

  zen_europe_ind_heat_v1_no_flex_single_temp:
    extends: zen_europe_ind_heat_v1_no_flexibility
    settings:
      structure:
        remove_technologies: *low_band_heat_pumps
